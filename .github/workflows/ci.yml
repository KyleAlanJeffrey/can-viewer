name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      WASM_PACK_VERSION: 0.15.0
      # From https://github.com/wasm-bindgen/wasm-pack/releases/tag/v0.15.0, as in scripts/build-cloudflare.sh.
      WASM_PACK_SHA256: c09f971ecaed9a2efc80fdcea7a00ef6b53c7fadc8c57d1f61b53a6aa66b668a
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy --target wasm32-unknown-unknown
          rustup default stable

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

      - name: Install wasm-pack
        run: |
          name="wasm-pack-v$WASM_PACK_VERSION-x86_64-unknown-linux-musl"
          curl --proto '=https' --tlsv1.2 -sSfL -o "$RUNNER_TEMP/$name.tar.gz" \
            "https://github.com/wasm-bindgen/wasm-pack/releases/download/v$WASM_PACK_VERSION/$name.tar.gz"
          echo "$WASM_PACK_SHA256  $RUNNER_TEMP/$name.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/$name.tar.gz" -C "$RUNNER_TEMP"
          install "$RUNNER_TEMP/$name/wasm-pack" "$HOME/.cargo/bin/wasm-pack"

      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install web dependencies
        run: pnpm --dir web install --frozen-lockfile

      - name: Build wasm
        run: pnpm --dir web run wasm

      - name: Type-check
        working-directory: web
        run: npx tsc -b

      - name: Build
        working-directory: web
        run: npx vite build

      - name: Web tests
        run: pnpm --dir web test
